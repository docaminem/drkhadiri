<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PWA de suivi AVK/Sintrom: calcul de dosage, historique INR, TTR et alertes d'instabilité."
    />
    <meta name="theme-color" content="#0f4c81" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>AVK Care - Gestion Sintrom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const defaultProfile = {
        fullName: "",
        age: "",
        weight: "",
        indication: "ACFA",
        targetMin: 2,
        targetMax: 3,
        currentWeeklyDoseMg: 14,
        tabletMg: 4,
      };

      const indicationOptions = ["ACFA", "Valve mécanique", "TVP/EP", "Autre"];

      const load = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      };

      const roundQuarter = (value) => Math.max(0, Math.round(value * 4) / 4);

      const getAdjustment = (inr, min, max) => {
        if (inr < min - 0.5) return 0.2;
        if (inr < min) return 0.1;
        if (inr > max + 1) return -0.2;
        if (inr > max) return -0.1;
        return 0;
      };

      const buildWeeklyPlan = (weeklyDoseMg, tabletMg) => {
        const days = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
        const totalQuarters = Math.round((weeklyDoseMg / tabletMg) * 4);
        const base = Math.floor(totalQuarters / 7);
        let extra = totalQuarters % 7;
        return days.map((day) => {
          const quarters = base + (extra > 0 ? 1 : 0);
          if (extra > 0) extra -= 1;
          return {
            day,
            quarters,
            doseMg: roundQuarter((quarters / 4) * tabletMg),
            tablets: roundQuarter(quarters / 4),
          };
        });
      };

      const calculateTTR = (entries, targetMin, targetMax) => {
        if (!entries.length) return 0;
        const inRange = entries.filter(
          (e) => e.inr >= targetMin && e.inr <= targetMax
        ).length;
        return Math.round((inRange / entries.length) * 100);
      };

      const App = () => {
        const [profile, setProfile] = useState(load("avk-profile", defaultProfile));
        const [entries, setEntries] = useState(load("avk-entries", []));
        const [form, setForm] = useState({
          inr: "",
          date: new Date().toISOString().slice(0, 10),
        });

        useEffect(() => localStorage.setItem("avk-profile", JSON.stringify(profile)), [profile]);
        useEffect(() => localStorage.setItem("avk-entries", JSON.stringify(entries)), [entries]);

        useEffect(() => {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
          }
        }, []);

        const sortedEntries = useMemo(
          () => [...entries].sort((a, b) => new Date(a.date) - new Date(b.date)),
          [entries]
        );

        const latest = sortedEntries[sortedEntries.length - 1];
        const targetMid = (Number(profile.targetMin) + Number(profile.targetMax)) / 2;

        const recommendation = useMemo(() => {
          if (!latest) return null;
          const adjustment = getAdjustment(
            latest.inr,
            Number(profile.targetMin),
            Number(profile.targetMax)
          );
          const newWeeklyDose = Math.max(
            0,
            roundQuarter(Number(profile.currentWeeklyDoseMg) * (1 + adjustment))
          );
          return {
            adjustment,
            newWeeklyDose,
            plan: buildWeeklyPlan(newWeeklyDose, Number(profile.tabletMg)),
          };
        }, [latest, profile]);

        const ttr = calculateTTR(
          sortedEntries,
          Number(profile.targetMin),
          Number(profile.targetMax)
        );

        const instabilityAlert =
          sortedEntries.length >= 4 && (ttr < 65 || Math.abs((latest?.inr ?? targetMid) - targetMid) > 1);

        const handleAddEntry = (e) => {
          e.preventDefault();
          const inr = Number(form.inr);
          if (!inr || !form.date) return;
          const newEntry = {
            id: crypto.randomUUID(),
            date: form.date,
            inr,
          };
          setEntries((prev) => [...prev, newEntry]);
          setForm((prev) => ({ ...prev, inr: "" }));
        };

        const printReport = () => window.print();

        const points = sortedEntries.map((e, idx) => ({
          x: sortedEntries.length === 1 ? 50 : (idx / (sortedEntries.length - 1)) * 100,
          y: Math.max(0, 100 - (e.inr / 6) * 100),
          ...e,
        }));

        const zoneTop = Math.max(0, 100 - (Number(profile.targetMax) / 6) * 100);
        const zoneHeight = ((Number(profile.targetMax) - Number(profile.targetMin)) / 6) * 100;

        return (
          <main className="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
            <header className="bg-white rounded-2xl shadow p-6 border border-slate-200">
              <h1 className="text-2xl md:text-3xl font-bold text-sky-900">AVK Care - Suivi Sintrom</h1>
              <p className="text-slate-600 mt-2">
                Outil d'aide à la décision pour le suivi INR, la proposition de dose hebdomadaire et la
                surveillance de la stabilité (TTR).
              </p>
              <p className="mt-3 text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
                ⚠️ Disclaimer: cette application est un outil d'aide. La décision thérapeutique finale
                revient au médecin.
              </p>
            </header>

            <section className="grid md:grid-cols-2 gap-6">
              <article className="bg-white rounded-2xl shadow p-6 border border-slate-200">
                <h2 className="text-xl font-semibold text-sky-800 mb-4">Profil patient</h2>
                <div className="grid grid-cols-2 gap-3">
                  <input className="border p-2 rounded col-span-2" placeholder="Nom"
                    value={profile.fullName}
                    onChange={(e) => setProfile({ ...profile, fullName: e.target.value })} />
                  <input className="border p-2 rounded" type="number" placeholder="Âge"
                    value={profile.age}
                    onChange={(e) => setProfile({ ...profile, age: e.target.value })} />
                  <input className="border p-2 rounded" type="number" placeholder="Poids (kg)"
                    value={profile.weight}
                    onChange={(e) => setProfile({ ...profile, weight: e.target.value })} />
                  <select className="border p-2 rounded col-span-2"
                    value={profile.indication}
                    onChange={(e) => setProfile({ ...profile, indication: e.target.value })}>
                    {indicationOptions.map((x) => <option key={x}>{x}</option>)}
                  </select>
                  <input className="border p-2 rounded" type="number" step="0.1" placeholder="INR cible min"
                    value={profile.targetMin}
                    onChange={(e) => setProfile({ ...profile, targetMin: Number(e.target.value) })} />
                  <input className="border p-2 rounded" type="number" step="0.1" placeholder="INR cible max"
                    value={profile.targetMax}
                    onChange={(e) => setProfile({ ...profile, targetMax: Number(e.target.value) })} />
                  <input className="border p-2 rounded" type="number" step="0.25" placeholder="Dose hebdo actuelle (mg)"
                    value={profile.currentWeeklyDoseMg}
                    onChange={(e) => setProfile({ ...profile, currentWeeklyDoseMg: Number(e.target.value) })} />
                  <input className="border p-2 rounded" type="number" step="0.5" placeholder="Comprimé (mg)"
                    value={profile.tabletMg}
                    onChange={(e) => setProfile({ ...profile, tabletMg: Number(e.target.value) })} />
                </div>
              </article>

              <article className="bg-white rounded-2xl shadow p-6 border border-slate-200">
                <h2 className="text-xl font-semibold text-sky-800 mb-4">Saisie INR</h2>
                <form onSubmit={handleAddEntry} className="space-y-3">
                  <input className="border p-2 rounded w-full" type="date" value={form.date}
                    onChange={(e) => setForm({ ...form, date: e.target.value })} />
                  <input className="border p-2 rounded w-full" type="number" step="0.1" min="0"
                    placeholder="INR du jour" value={form.inr}
                    onChange={(e) => setForm({ ...form, inr: e.target.value })} />
                  <button className="w-full bg-sky-700 hover:bg-sky-800 text-white rounded p-2">Ajouter mesure</button>
                </form>

                <div className="mt-4 p-3 rounded bg-sky-50 border border-sky-200 text-sm">
                  <p><strong>TTR:</strong> {ttr}%</p>
                  {instabilityAlert ? (
                    <p className="text-red-700 mt-1">Alerte IA: INR instable (hors zone fréquent).</p>
                  ) : (
                    <p className="text-emerald-700 mt-1">Stabilité acceptable pour le moment.</p>
                  )}
                </div>
              </article>
            </section>

            <section className="grid md:grid-cols-2 gap-6">
              <article className="bg-white rounded-2xl shadow p-6 border border-slate-200">
                <h2 className="text-xl font-semibold text-sky-800 mb-4">Algorithme de dosage</h2>
                {!recommendation ? (
                  <p className="text-slate-500">Ajoutez une mesure INR pour obtenir une recommandation.</p>
                ) : (
                  <>
                    <p className="text-slate-700">
                      Dernier INR: <strong>{latest.inr.toFixed(1)}</strong> | Cible {profile.targetMin} - {profile.targetMax}
                    </p>
                    <p className="mt-2">
                      Ajustement hebdomadaire recommandé: <strong>{Math.round(recommendation.adjustment * 100)}%</strong>
                    </p>
                    <p>
                      Nouvelle dose hebdomadaire: <strong>{recommendation.newWeeklyDose} mg</strong>
                    </p>
                    <div className="mt-3 grid grid-cols-2 gap-2 text-sm">
                      {recommendation.plan.map((d) => (
                        <div key={d.day} className="border rounded p-2 bg-slate-50">
                          <strong>{d.day}</strong>: {d.tablets} cp ({d.doseMg} mg)
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </article>

              <article className="bg-white rounded-2xl shadow p-6 border border-slate-200">
                <h2 className="text-xl font-semibold text-sky-800 mb-4">Historique & graphique INR</h2>
                <div className="relative border rounded bg-white p-2">
                  <svg viewBox="0 0 100 100" className="w-full h-56">
                    <rect x="0" y={zoneTop} width="100" height={zoneHeight} fill="#dbeafe" />
                    <line x1="0" y1="0" x2="0" y2="100" stroke="#cbd5e1" />
                    <line x1="0" y1="100" x2="100" y2="100" stroke="#cbd5e1" />
                    {points.map((p, i) =>
                      i > 0 ? (
                        <line
                          key={`line-${p.id}`}
                          x1={points[i - 1].x}
                          y1={points[i - 1].y}
                          x2={p.x}
                          y2={p.y}
                          stroke="#0f4c81"
                          strokeWidth="0.8"
                        />
                      ) : null
                    )}
                    {points.map((p) => (
                      <circle key={p.id} cx={p.x} cy={p.y} r="1.5" fill="#0284c7" />
                    ))}
                  </svg>
                </div>
                <ul className="mt-3 max-h-40 overflow-auto text-sm space-y-1">
                  {sortedEntries.map((e) => (
                    <li key={e.id} className="border-b pb-1 flex justify-between">
                      <span>{e.date}</span>
                      <strong>INR {e.inr}</strong>
                    </li>
                  ))}
                </ul>
              </article>
            </section>

            <section className="bg-white rounded-2xl shadow p-6 border border-slate-200">
              <h2 className="text-xl font-semibold text-sky-800 mb-3">Export & architecture cible</h2>
              <div className="flex flex-wrap gap-3">
                <button onClick={printReport} className="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded">
                  Export PDF (impression)
                </button>
              </div>
              <pre className="mt-4 text-xs bg-slate-900 text-slate-100 p-3 rounded overflow-auto">{`-- Extrait structure DB (Supabase/Firebase-ready)
patients(id, full_name, age, weight, indication, target_min, target_max, current_weekly_dose_mg)
inr_logs(id, patient_id, date, inr_value, recommended_weekly_dose_mg, ttr_snapshot)
alerts(id, patient_id, date, level, message, resolved)`}</pre>
            </section>
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
